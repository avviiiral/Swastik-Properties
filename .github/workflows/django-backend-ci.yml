name: Django Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        working-directory: backend
        run: python manage.py check

      - name: Check migration consistency
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run account, location and property tests
        working-directory: backend
        run: python manage.py test apps.accounts apps.locations apps.properties

  admin-dashboard-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/admin-dashboard/package.json

      - name: Install dashboard dependencies
        working-directory: frontend/admin-dashboard
        run: npm install --no-audit --no-fund

      - name: Build Admin Dashboard
        working-directory: frontend/admin-dashboard
        run: npm run build
