name: Unified Frontend CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "frontend/public-website/**"
      - ".github/workflows/public-website-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/public-website/**"
      - ".github/workflows/public-website-ci.yml"

permissions:
  contents: read

jobs:
  unified-frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/public-website/package.json
      - name: Install unified frontend dependencies
        working-directory: frontend/public-website
        run: npm install --no-audit --no-fund
      - name: Build unified Angular SSR application
        working-directory: frontend/public-website
        run: npm run build
